<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis Tool</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Stock Analysis Tool</h1>
            <p class="subtitle">Find stocks that dropped significantly from YTD high and increased today</p>
        </header>

        <div class="controls">
            <div class="form-group">
                <label for="dropThreshold">Drop from High (%):</label>
                <input type="number" id="dropThreshold" value="40" min="0" max="100" step="1">
            </div>
            <div class="form-group">
                <label for="increaseThreshold">Increase Today (%):</label>
                <input type="number" id="increaseThreshold" value="5" min="0" max="100" step="0.1">
            </div>
            <div class="form-group">
                <label for="maxStocks">Max Stocks (optional):</label>
                <input type="number" id="maxStocks" placeholder="All stocks" min="1">
            </div>
            <button id="analyzeBtn" class="btn-primary">Analyze Stocks</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing stocks... This may take a few minutes.</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="results" class="results hidden">
            <h2>Results</h2>
            <p class="result-count" id="resultCount"></p>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Yesterday Price</th>
                            <th>Today Price</th>
                            <th>YTD High</th>
                            <th>Drop from High</th>
                            <th>Increase Today</th>
                            <th>Yesterday Date</th>
                            <th>Today Date</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
